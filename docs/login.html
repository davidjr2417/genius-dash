<html lang="en">
<title> Genius Dashbboard</title>

<body class="app sidebar-mini">
  
    <style>
        body {
      font-family: 'Quicksand', sans-serif;
      background: #4527A0;
      height: 90vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    /*--Button Styles--*/
    .btn {
      position: relative;
      color: #D1C4E9;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: #D1C4E9 1px 0 10px;
      height: 175px;
      width: 175px;
      border: solid 1px #D1C4E9;
      border-radius: 175px;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    
    .btn:before {
      content: '';
      position: absolute;
      background: #9575CD;
      width: 0;
      height: 0;
      z-index: -1;
      border-radius: 175px;
      box-shadow: 0px 0px 24px 1px rgba(224,199,224,0.2);
      transition: all 900ms cubic-bezier(1.000, -0.195, 0.000, 1.330);
      transition-timing-function: cubic-bezier(1.000, -0.195, 0.000, 1.330);
    }
    
    .btn:hover:before {
      width: 85%;
      height: 85%;
    }
    
    .btn:active:before, .btn:focus:before {
      width: 100%;
      height: 100%;
    }
    </style>
    <a  class="btn" id="authorize_button" >Sign In</a>

    <!--Add buttons to initiate auth sequence and sign out-->
   

    <pre id="content" style="white-space: pre-wrap;"></pre>

    <script type="text/javascript">
      // Client ID and API key from the Developer Console
      var CLIENT_ID = '266643809945-7qk12p5fvqj3s3uopaq40cs45dul1vn0.apps.googleusercontent.com';
      var API_KEY = 'AIzaSyBM84ndf0SpFtXRg-mkiQkGi4f2aRTV2rc';

      // Array of API discovery doc URLs for APIs used by the quickstart
      var DISCOVERY_DOCS = ["https://script.googleapis.com/$discovery/rest?version=v1"];

      // Authorization scopes required by the API; multiple scopes can be
      // included, separated by spaces.
      var SCOPES = 'https://www.googleapis.com/auth/spreadsheets';

      var authorizeButton = document.getElementById('authorize_button');
      var signoutButton = document.getElementById('signout_button');

      /**
       *  On load, called to load the auth2 library and API client library.
       */
      function handleClientLoad() {
        gapi.load('client:auth2', initClient);
        
      }

      /**
       *  Initializes the API client library and sets up sign-in state
       *  listeners.
       */
      function initClient() {
        console.log("initClient Function")
        gapi.client.init({
          apiKey: API_KEY,
          clientId: CLIENT_ID,
          discoveryDocs: DISCOVERY_DOCS,
          scope: SCOPES
        }).then(function () {
          console.log("initClient Function Callback")
          // Listen for sign-in state changes.
          gapi.auth2.getAuthInstance().isSignedIn.listen(updateSigninStatus);

          // Handle the initial sign-in state.
          updateSigninStatus(gapi.auth2.getAuthInstance().isSignedIn.get());
          authorizeButton.onclick = handleAuthClick;
          signoutButton.onclick = handleSignoutClick;
        }, function(error) {
          appendPre(JSON.stringify(error, null, 2));
        });
      }

   

      /**
       *  Called when the signed in status changes, to update the UI
       *  appropriately. After a sign-in, the API is called.
       */
      function updateSigninStatus(isSignedIn) {

        if (isSignedIn ) {
            var auth2 = gapi.auth2.getAuthInstance();
var profile = auth2.currentUser.get().getBasicProfile();

var email = profile.getEmail().toString();
         if(email.indexOf('hiddengeniusproject') !== -1){
          
          window.location.href = "./dashboard.html";
        } }
      
      }

      /**
       *  Sign in the user upon button click.
       */
      function handleAuthClick(event) {
        gapi.auth2.getAuthInstance().signIn();
      }

      /**
       *  Sign out the user upon button click.
       */
      function handleSignoutClick(event) {
        gapi.auth2.getAuthInstance().signOut();
      }

      /**
       * Append a pre element to the body containing the given message
       * as its text node. Used to display the results of the API call.
       *
       * @param {string} message Text to be placed in pre element.
       */
      function appendPre(message) {
        var pre = document.getElementById('content');
        var textContent = document.createTextNode(message + '\n');
        pre.appendChild(textContent);
      }

      /**
       * Shows basic usage of the Apps Script API.
       *
       * Call the Apps Script API to create a new script project, upload files
       * to the project, and log the script's URL to the user.
       */
       function geniusPortalInit() {
  var scriptId = "14DqVwveVm7DW84xpSQsIFeTh4ulrELBicHR-dK5Qsj9DQW-3R-ukgskA";
console.log("geniusPortal")
  // Call the Apps Script API run method
  //   'scriptId' is the URL parameter that states what script to run
  //   'resource' describes the run request body (with the function name
  //              to execute)
  gapi.client.script.scripts.run({
      'scriptId': scriptId,
    'resource': {
      'function': 'getUserData',
      'devMode': false
    }
  }).then(function(resp) {
    console.log(resp)
    var result = resp.result;
    if (result.error && result.error.status) {
      // The API encountered a problem before the script
      // started executing.
      appendPre('Error calling API:');
      appendPre(JSON.stringify(result, null, 2));
      console.log("error 1")
    } else if (result.error) {
      // The API executed, but the script returned an error.
      console.log("error 2");
      console.log(result.error)
      // Extract the first (and only) set of error details.
      // The values of this object are the script's 'errorMessage' and
      // 'errorType', and an array of stack trace elements.
      var error = result.error.details[0];
      appendPre('Script error message: ' + error.errorMessage);

      if (error.scriptStackTraceElements) {
        // There may not be a stacktrace if the script didn't start
        // executing.
        appendPre('Script error stacktrace:');
        for (var i = 0; i < error.scriptStackTraceElements.length; i++) {
          var trace = error.scriptStackTraceElements[i];
          appendPre('\t' + trace.function + ':' + trace.lineNumber);
        }
      }
    } else {
      // The structure of the result will depend upon what the Apps
      // Script function returns. Here, the function returns an Apps
      // Script Object with String keys and values, and so the result
      // is treated as a JavaScript object (folderSet).
      console.log("Good")
      console.log(result.response.result)
       userObj = result.response.result;
    for (const property in userObj) {
    console.log('[name ="genius-'+ property+'"]');
      
      
      
      
      if(property=="ttl-stipend"){
     $('[name ="genius-'+property+'"]').html(userObj[property].toFixed(2)) ;
    }else{
    
    
    
    if(property=="ttl-missed-hrs"){
    var sum = userObj["oh-hrs-attend"]+userObj["pg-hrs-attend"]+userObj["makeup-hrs-attend"];
     $('[name ="genius-ttl-attend-hrs"]').html(sum)
    
    }
    if(property=="perfect-attend"){
    var color = "#17a2b8";
    console.log(color+"color");
    if(userObj[property]=="Perfect"){
        color = "#28a745";
         $('[name ="genius-'+property+'-amt"]').html("100");
         
          $('[name ="genius-'+property+'-color"]').removeClass("fa fa-thumbs-o-down");
          $('[name ="genius-'+property+'-color"]').removeClass("transform-icon");
       $('[name ="genius-'+property+'-color"]').addClass("fa fa-thumbs-o-up");
    }
    else if(userObj[property]=="Almost Perfect"){
        $('[name ="genius-'+property+'-amt"]').html("50");
      color = "#ffc107";
          $('[name ="genius-'+property+'-color"]').removeClass("fa fa-thumbs-o-down");
          $('[name ="genius-'+property+'-color"]').addClass("transform-icon");
       $('[name ="genius-'+property+'-color"]').addClass("fa fa-thumbs-o-up");
 
       
    }else if(userObj[property]=="Not Perfect"){
        color = "#dc3545";
          $('[name ="genius-'+property+'-amt"]').html("0");
          $('[name ="genius-'+property+'-color"]').removeClass("fa fa-thumbs-o-up");
               $('[name ="genius-'+property+'-color"]').removeClass("transform-icon");

     $('[name ="genius-'+property+'-color"]').addClass("fa fa-thumbs-o-down");;
   
              }else{
    color = "#17a2b8";
       $('[name ="genius-'+property+'-color"]').removeClass("fa fa-thumbs-o-down");
          $('[name ="genius-'+property+'-color"]').removeClass("transform-icon");
       $('[name ="genius-'+property+'-color"]').addClass("fa fa-thumbs-o-up");
    
    }
    console.log($('[name ="genius-'+property+'-color"]'));
     $('[name ="genius-'+property+'-color"]').css("background-color", color);
      
    } 
      $('[name ="genius-'+property+'"]').html(userObj[property]) ;
   
    }}
    }
  });
}


    
    </script>

    <script async defer src="https://apis.google.com/js/api.js"
      onload="this.onload=function(){};handleClientLoad()"
      onreadystatechange="if (this.readyState === 'complete') this.onload()">
    </script>
