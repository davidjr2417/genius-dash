  <style>
    body {
      font-family: 'Quicksand', sans-serif;
      background: #4527A0;
      height: 90vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /*--Button Styles--*/
    .btn {
      position: relative;
      color: #D1C4E9;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: #D1C4E9 1px 0 10px;
      height: 175px;
      width: 175px;
      border: solid 1px #D1C4E9;
      border-radius: 175px;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      cursor: pointer;
    }

    .btn:before {
      content: '';
      position: absolute;
      background: #9575CD;
      width: 0;
      height: 0;
      z-index: -1;
      border-radius: 175px;
      box-shadow: 0px 0px 24px 1px rgba(224, 199, 224, 0.2);
      transition: all 900ms cubic-bezier(1.000, -0.195, 0.000, 1.330);
      transition-timing-function: cubic-bezier(1.000, -0.195, 0.000, 1.330);
    }

    .btn:hover:before {
      width: 85%;
      height: 85%;
    }

    .btn:active:before,
    .btn:focus:before {
      width: 100%;
      height: 100%;
    }
  </style>

  <script>
    function handleLoginLoad() {
      gapi.load('client:auth2', clientLogin);


    }


    /**
     *  Initializes the API client library and sets up sign-in state
     *  listeners.
     */
    function clientLogin() {
      //   console.log("initClient Function")
      auth2 = gapi.client.init({
        apiKey: API_KEY,
        clientId: CLIENT_ID,
        discoveryDocs: DISCOVERY_DOCS,
        scope: SCOPES
      }).then(function () {
        // console.log("initClient Function Callback")
        // Listen for sign-in state changes.
        gapi.auth2.getAuthInstance().isSignedIn.listen(updateLoginStatus);
        var auth2 = gapi.auth2.getAuthInstance();

        // Handle the initial sign-in state.
        updateLoginStatus(gapi.auth2.getAuthInstance().isSignedIn.get());
        authorizeButton.onclick = handleAuthClick;
        // signoutButton.onclick = handleSignoutClick;
      }, function (error) {
        appendPre(JSON.stringify(error, null, 2));
      });
    }


    /**
     *  Called when the signed in status changes, to update the UI
     *  appropriately. After a sign-in, the API is called.
     */
    function updateLoginStatus(isSignedIn) {
      /*Get Current Email Information To Make Sure Hidden Genius Domain*/
     
      if (isSignedIn) {
        var auth2 = gapi.auth2.getAuthInstance();
      var profile = auth2.currentUser.get().getBasicProfile();
   
        var email = profile.getEmail().toString();
      
        if (isSignedIn && email.indexOf('hiddengeniusproject') !== -1) {
       
          asynFunction() ;
          
        } else {
          
          window.location.href = "./login.html";
        }
      }
    }
